<body>
<div id="root"><div class="boot"><strong>HOT BOX</strong><p>Shuffling the table…</p></div></div>
<div id="overlay" class="overlay" hidden></div>
<div id="handoff" class="handoff" hidden></div>
<div id="fx" aria-hidden="true"></div>
<div id="notice" class="notice" role="status" hidden></div>
<script>
window.addEventListener('error',function(e){var el=document.getElementById('notice');if(el){el.hidden=false;el.textContent='Hot Box hit an error: '+(e.message||'unknown error')+'. Close and reopen to restore your saved turn.';}});
</script>
