name: Build and test Hot Box After Hours
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hotbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare After Hours source
        run: python3 expansion/unpack.py
      - name: Classic and campaign tests
        run: |
          mkdir -p evidence
          node tests/engine.test.js | tee evidence/classic-tests.txt
          node tests/simulate.js | tee evidence/classic-simulations.txt
          node expansion/tests/campaign.test.js | tee evidence/campaign-tests.txt
      - name: Check bundled artwork
        run: python3 scripts/check_assets.py
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app and native smoke tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify signature and collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/HotBox-0.3.0.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/HotBox-0.3.0-tests.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/HotBox-0.3.0.apk > out/signature.txt
          sha256sum out/HotBox-0.3.0.apk > out/SHA256SUMS.txt
          cp evidence/*.txt out/
      - name: Package the exact source used by this build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('.')
          excluded = {'.git','.gradle','build','out','evidence','__pycache__','.idea'}
          with ZipFile('out/HotBox-0.3.0-source.zip','w',ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or any(x in excluded for x in p.parts): continue
                  if p.suffix in {'.keystore','.jks','.ttf','.otf'} or p.name=='local.properties': continue
                  z.write(p,'HotBox-0.3.0/'+p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HotBox-0.3.0-build
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: HotBox-0.3.0-build-evidence
          path: evidence/
          if-no-files-found: warn
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test scripts
        run: python3 expansion/unpack.py
      - uses: actions/download-artifact@v4
        with:
          name: HotBox-0.3.0-build
          path: out
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HotBox-0.3.0-android-${{ matrix.api }}-evidence
          path: evidence/
          if-no-files-found: warn
  publish-source:
    needs: [build, android-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Expand the verified source
        run: python3 expansion/unpack.py
      - name: Publish tested readable modules without overwriting concurrent changes
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Main changed during testing. Keeping the source artifact; not pushing.'
            exit 0
          fi
          git config user.name 'Hot Box Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch expansion/transport-0.bin expansion/transport-1.bin expansion/transport-2.bin
          git add app expansion README.md scripts/smoke.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish tested After Hours 0.3 source [skip ci]'
          git push origin HEAD:main
