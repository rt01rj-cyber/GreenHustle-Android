name: Build and test Hot Box APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hotbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Game rules and 1000 complete matches
        run: node tests/engine.test.js && node tests/simulate.js
      - name: Check bundled artwork
        run: python3 scripts/check_assets.py
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app and native smoke tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify signature and collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/HotBox-0.2.0.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/HotBox-0.2.0-tests.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose out/HotBox-0.2.0.apk
          sha256sum out/HotBox-0.2.0.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HotBox-0.2.0-build
          path: out/
          if-no-files-found: error
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HotBox-0.2.0-build
          path: out
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HotBox-android-${{ matrix.api }}-test-evidence
          path: evidence/
          if-no-files-found: warn
